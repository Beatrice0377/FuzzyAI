[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probvenance"
version = "0.0.1"
description = "Provider-agnostic probabilistic decision runtime for language models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transformers = ["torch>=2.7", "transformers>=4.53"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/probvenance"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
